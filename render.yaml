# Blueprint de Render: crea la app web Y su base de datos Postgres gratuita, ya conectadas.
services:
  - type: web
    name: victora
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: victora-db
          property: connectionString

databases:
  - name: victora-db
    plan: free
    databaseName: victora
    user: victora
